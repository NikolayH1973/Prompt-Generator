<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #e2e8f0; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; font-size: 32px; margin-bottom: 30px; background: linear-gradient(135deg, #60a5fa, #a78bfa, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .button-group { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; color: white; }
        .btn-preset { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-preset:hover { box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
        .btn-history { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-history:hover { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .btn-import { background: linear-gradient(135deg, #a855f7, #9333ea); }
        .btn-import:hover { box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
        .btn-nav { background: rgba(71, 85, 105, 0.3); border: 1px solid rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .btn-nav:hover:not(:disabled) { background: rgba(71, 85, 105, 0.5); }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-next { background: linear-gradient(135deg, #3b82f6, #a855f7) !important; border: none !important; }
        .btn-next:hover:not(:disabled) { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .btn-export { background: rgba(71, 85, 105, 0.3); border: 1px solid rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .btn-export:hover { background: rgba(71, 85, 105, 0.5); }
        .progress-container { margin-bottom: 30px; background: rgba(30, 41, 59, 0.5); padding: 20px; border-radius: 12px; border: 1px solid rgba(148, 163, 184, 0.1); }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #cbd5e1; }
        .progress-bar { width: 100%; height: 8px; background: rgba(71, 85, 105, 0.3); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899); transition: width 0.5s ease; }
        .question-container { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; padding: 30px; margin-bottom: 30px; }
        .question-block { display: inline-block; padding: 6px 12px; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.5); border-radius: 20px; font-size: 12px; font-weight: 600; color: #93c5fd; margin-bottom: 15px; }
        .question-block.followup { background: rgba(217, 119, 6, 0.2); border-color: rgba(217, 119, 6, 0.5); color: #fcd34d; }
        h2 { font-size: 24px; margin-bottom: 20px; color: #f1f5f9; }
        textarea { width: 100%; height: 150px; padding: 15px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 8px; color: #e2e8f0; font-size: 14px; font-family: 'Monaco', 'Menlo', monospace; resize: vertical; margin-bottom: 20px; }
        textarea::placeholder { color: #64748b; }
        .button-nav { display: flex; gap: 15px; }
        .panel { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .panel h3 { color: #cbd5e1; margin-bottom: 15px; font-size: 14px; }
        .panel-item { padding: 12px; background: rgba(71, 85, 105, 0.2); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 8px; color: #e2e8f0; font-size: 14px; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .export-container { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; padding: 30px; }
        .export-section { margin-bottom: 20px; }
        .export-section h3 { font-size: 16px; margin-bottom: 15px; color: #cbd5e1; }
        .export-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .prompt-preview { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 8px; padding: 20px; max-height: 400px; overflow-y: auto; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 15px; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #86efac; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Prompt Generator</h1>
        <div class="button-group">
            <button class="btn-preset" onclick="togglePresets()">📋 Предустановки</button>
            <button class="btn-history" onclick="toggleHistory()">📚 История (<span id="historyCount">0</span>)</button>
            <button class="btn-import" onclick="document.getElementById('fileInput').click()">📂 Импорт</button>
            <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)">
        </div>
        <div id="presetsPanel" class="panel hidden">
            <h3>Выбери предустановку:</h3>
            <button class="btn-export" onclick="applyPreset('ecommerce')" style="width: 100%; margin-bottom: 10px;">🛒 E-commerce магазин</button>
            <button class="btn-export" onclick="applyPreset('saas')" style="width: 100%; margin-bottom: 10px;">☁️ SaaS приложение</button>
            <button class="btn-export" onclick="applyPreset('portfolio')" style="width: 100%; margin-bottom: 10px;">🎨 Портфолио разработчика</button>
            <button class="btn-export" onclick="applyPreset('api')" style="width: 100%;">⚙️ REST API сервис</button>
        </div>
        <div id="historyPanel" class="panel hidden">
            <h3>История проектов:</h3>
            <div id="historyList"></div>
        </div>
        <div class="progress-container">
            <div class="progress-text">
                <span>Шаг <span id="currentStep">1</span> из <span id="totalSteps">9</span></span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="question-container" id="questionContainer">
            <div id="blockLabel" class="question-block"></div>
            <h2 id="questionText"></h2>
            <textarea id="answerInput"></textarea>
            <div class="button-nav">
                <button class="btn-nav" id="btnPrev" onclick="prevQuestion()" disabled>← Назад</button>
                <button class="btn-next btn-nav" id="btnNext" onclick="nextQuestion()" disabled>Далее →</button>
            </div>
        </div>
        <div id="finalPanel" class="export-container hidden">
            <div class="export-section">
                <h3>Сохрани проект:</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="projectName" placeholder="Например: E-commerce v1...">
                    <button class="btn-preset" onclick="saveToHistory()" style="padding: 12px 20px; white-space: nowrap;">💾 Сохр.</button>
                </div>
            </div>
            <div class="export-section">
                <h3>Превью промта:</h3>
                <div class="prompt-preview" id="promptPreview"></div>
            </div>
            <div class="export-section">
                <h3>Экспорт:</h3>
                <div class="export-buttons" style="grid-template-columns: 1fr 1fr 1fr;">
                    <button class="btn-export" onclick="copyPrompt()">📋 Копировать</button>
                    <button class="btn-export" onclick="downloadFile(getPrompt(), 'prompt.md', 'text/markdown')">📥 .md</button>
                    <button class="btn-export" onclick="downloadFile(getJSON(), 'answers.json', 'application/json')">📥 .json</button>
                </div>
                <button class="btn-export" onclick="toggleApiInput()" style="width: 100%; margin-top: 10px;">✨ Полировка AI</button>
                <div id="apiSection" class="hidden" style="margin-top: 10px;">
                    <input type="password" id="apiKey" placeholder="sk-ant-..." style="margin-bottom: 5px;">
                    <button class="btn-preset" onclick="polishPrompt()" style="width: 100%; margin-bottom: 10px;">🔄 Отправить</button>
                    <p style="font-size: 12px; color: #64748b;">🔒 Ключ только в браузере</p>
                    <div id="polishMsg"></div>
                </div>
                <button class="btn-export" onclick="resetAll()" style="width: 100%; margin-top: 10px;">🔄 Заново</button>
            </div>
        </div>
    </div>
    <script>
        const presets={ecommerce:{answers:{task:'Интернет-магазин с каталогом товаров, корзиной и системой оплаты',problem:'Позволяет продавать товары онлайн и управлять заказами',audience:'Клиенты для покупок, администраторы магазина',scope:'Каталог товаров, фильтрация, корзина, оформление заказа, личный кабинет',payment:'Stripe, Яндекс.Касса, карты, PayPal',security:'OAuth, 2FA для admin, GDPR-compliant',design:'Минимализм, светлая тема, интуитивная навигация',tech:'React, Node.js, PostgreSQL, Redis, Docker',constraints:'4 недели, мобильная версия, SEO оптимизация'}},saas:{answers:{task:'Платформа для управления проектами с командным сотрудничеством',problem:'Экономит время команде на управление задачами',audience:'PM, разработчики, менеджеры (5-50 человек)',scope:'Доски задач, комментарии real-time, уведомления, Slack интеграция',payment:'Stripe, подписка \$29/месяц, автопродление',security:'2FA, SSO (OAuth), GDPR-compliant',design:'Современный минимализм, тёмная/светлая тема',tech:'React, NestJS, PostgreSQL, WebSocket',constraints:'3 месяца, MVP за 6 недель'}},portfolio:{answers:{task:'Личное портфолио разработчика с примерами работ',problem:'Показывает работодателям твои навыки и опыт',audience:'Рекрутеры, работодатели, разработчики',scope:'Главная, галерея проектов, блог, контакты',design:'Минимализм, тёмная тема, плавные анимации',tech:'Next.js, TypeScript, TailwindCSS, Vercel',constraints:'1 неделя, Lighthouse 95+, SEO'}},api:{answers:{task:'Микросервис для управления пользователями',problem:'Предоставляет надёжный API для приложений',audience:'Frontend приложения, мобильные клиенты',scope:'CRUD операции, авторизация, логирование',security:'JWT токены, Rate limiting, CORS',design:'API документация, Swagger',tech:'Node.js, NestJS, PostgreSQL, Docker',constraints:'3 недели, production-ready'}}};
        const questions=[{id:'task',block:'Суть проекта',question:'Опиши идею проекта:',placeholder:'Например: интерактивное портфолио...'},{id:'problem',block:'→ Уточнение',question:'Какую проблему это решает?',placeholder:'Например: экономит время...',followup:!0},{id:'audience',block:'Аудитория',question:'Для кого это?',placeholder:'Например: junior-разработчики...'},{id:'scope',block:'Функциональность',question:'Какие ключевые функции?',placeholder:'Например: галерея, фильтр...'},{id:'payment',block:'→ Уточнение',question:'Система оплаты?',placeholder:'Например: Stripe, \$9.99/месяц...',followup:!0},{id:'security',block:'→ Уточнение',question:'Требования безопасности?',placeholder:'Например: OAuth, 2FA...',followup:!0},{id:'design',block:'Дизайн',question:'Как это должно выглядеть?',placeholder:'Например: минимализм, тёмная...'},{id:'tech',block:'Технологии',question:'Какие технологии?',placeholder:'Например: React, Node.js...'},{id:'constraints',block:'Ограничения',question:'Есть ли ограничения?',placeholder:'Например: 2 недели, мобильная...'}];
        let currentStep=0,answers={},history=[];
        function init(){loadHistory(),renderQuestion()}
        function renderQuestion(){const t=questions[currentStep];document.getElementById('questionText').textContent=t.question,document.getElementById('blockLabel').textContent=t.block,document.getElementById('blockLabel').className='question-block'+(t.followup?' followup':''),document.getElementById('answerInput').placeholder=t.placeholder,document.getElementById('answerInput').value=answers[t.id]||'',document.getElementById('currentStep').textContent=currentStep+1,document.getElementById('progressFill').style.width=(currentStep+1)/questions.length*100+'%',document.getElementById('progressPercent').textContent=Math.round((currentStep+1)/questions.length*100)+'%',document.getElementById('btnPrev').disabled=0===currentStep,updateNextButton(),currentStep===questions.length-1?(document.getElementById('questionContainer').classList.add('hidden'),document.getElementById('finalPanel').classList.remove('hidden'),document.getElementById('promptPreview').textContent=getPrompt()):(document.getElementById('questionContainer').classList.remove('hidden'),document.getElementById('finalPanel').classList.add('hidden'))}
        function updateNextButton(){const t=document.getElementById('answerInput').value.trim().length>0,e=currentStep===questions.length-1;document.getElementById('btnNext').disabled=!t||e}
        function nextQuestion(){const t=questions[currentStep];answers[t.id]=document.getElementById('answerInput').value.trim(),currentStep<questions.length-1&&(currentStep++,renderQuestion())}
        function prevQuestion(){if(currentStep>0){const t=questions[currentStep];answers[t.id]=document.getElementById('answerInput').value.trim(),currentStep--,renderQuestion()}}
        function getPrompt(){let t='# Техническое задание\n\n';return[['task','Суть проекта'],['problem','Решаемая проблема'],['audience','Целевая аудитория'],['scope','Функциональность'],['payment','Система оплаты'],['security','Безопасность'],['design','Дизайн'],['tech','Технологии'],['constraints','Ограничения']].forEach(([e,n])=>{answers[e]&&(t+=`## ${n}\n${answers[e]}\n\n`)}),t}
        function getJSON(){return JSON.stringify({project:{generatedAt:new Date().toISOString(),answers}},null,2)}
        function copyPrompt(){navigator.clipboard.writeText(getPrompt()).then(()=>alert('✓ Скопировано!'))}
        function downloadFile(t,e,n){const o=new Blob([t],{type:n}),r=URL.createObjectURL(o),a=document.createElement('a');a.href=r,a.download=e,a.click(),URL.revokeObjectURL(r)}
        function saveToHistory(){const t=document.getElementById('projectName').value.trim();if(!t)return void alert('Введи название');const e={id:Date.now(),name:t,date:new Date().toLocaleString('ru-RU'),answers:{...answers}};history.unshift(e),localStorage.setItem('promptHistory',JSON.stringify(history)),alert('✓ Сохранён!'),document.getElementById('projectName').value='',updateHistoryCount()}
        function loadHistory(){const t=localStorage.getItem('promptHistory');try{history=t?JSON.parse(t):[]}catch(e){history=[]}updateHistoryCount()}
        function updateHistoryCount(){document.getElementById('historyCount').textContent=history.length}
        function toggleHistory(){const t=document.getElementById('historyPanel');t.classList.toggle('hidden'),t.classList.contains('hidden')||(document.getElementById('historyList').innerHTML=0===history.length?'<p style="color: #64748b;">Нет проектов</p>':history.map(e=>`<div class="panel-item"><div><div style="font-weight: 600;">${e.name}</div><div style="font-size: 12px; color: #64748b;">${e.date}</div></div><div><button class="btn-export" onclick="loadItem(${e.id})">✓</button><button class="btn-export" onclick="deleteItem(${e.id})">✕</button></div></div>`).join(''))}
        function loadItem(t){const e=history.find(e=>e.id===t);e&&(answers={...e.answers},currentStep=0,document.getElementById('presetsPanel').classList.add('hidden'),document.getElementById('historyPanel').classList.add('hidden'),renderQuestion())}
        function deleteItem(t){history=history.filter(e=>e.id!==t),localStorage.setItem('promptHistory',JSON.stringify(history)),updateHistoryCount(),toggleHistory(),toggleHistory()}
        function togglePresets(){document.getElementById('presetsPanel').classList.toggle('hidden')}
        function applyPreset(t){answers={...presets[t].answers},currentStep=0,document.getElementById('presetsPanel').classList.add('hidden'),renderQuestion(),alert('✓ Применена!')}
        function loadFromFile(t){const e=t.target.files[0];if(e){const n=new FileReader;n.onload=t=>{try{const e=JSON.parse(t.target.result);e.project?.answers&&(answers=e.project.answers,currentStep=0,renderQuestion(),alert('✓ Загружено!'))}catch(t){alert('❌ Ошибка')}},n.readAsText(e)}}
        function toggleApiInput(){document.getElementById('apiSection').classList.toggle('hidden')}
        async function polishPrompt(){const t=document.getElementById('apiKey').value.trim();if(!t)return void alert('Введи API ключ');try{const e=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':t},body:JSON.stringify({model:'claude-opus-4-20250805',max_tokens:2e3,messages:[{role:'user',content:`Улучши техническое задание:\n\n${getPrompt()}`}]})});if(e.ok){const t=await e.json();document.getElementById('promptPreview').textContent=t.content[0].text,document.getElementById('polishMsg').innerHTML='<div class="msg">✓ Готово!</div>'}else alert('Ошибка API')}catch(t){alert('Ошибка подключения')}}
        function resetAll(){answers={},currentStep=0,document.getElementById('projectName').value='',renderQuestion()}
        document.addEventListener('DOMContentLoaded',function(){const t=document.getElementById('answerInput');t&&(t.addEventListener('input',updateNextButton),t.addEventListener('change',updateNextButton))}),window.onload=init;
    </script>
</body>
</html>
