<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Generator - Mac</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-preset { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-history { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-import { background: linear-gradient(135deg, #a855f7, #9333ea); }
        .btn-nav, .btn-export { background: rgba(71, 85, 105, 0.3); border: 1px solid rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .btn-nav:hover, .btn-export:hover { background: rgba(71, 85, 105, 0.5); }
        .btn-next { background: linear-gradient(135deg, #3b82f6, #a855f7) !important; border: none !important; }

        .progress-container {
            margin-bottom: 30px;
            background: rgba(30, 41, 59, 0.5);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(71, 85, 105, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899);
            transition: width 0.5s ease;
        }

        .question-container {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .question-block {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: 15px;
        }

        .question-block.followup {
            background: rgba(217, 119, 6, 0.2);
            border-color: rgba(217, 119, 6, 0.5);
            color: #fcd34d;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: 'Monaco', 'Menlo', monospace;
            resize: vertical;
            margin-bottom: 20px;
        }

        .button-nav {
            display: flex;
            gap: 15px;
        }

        .panel {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel h3 {
            color: #cbd5e1;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .panel-item {
            padding: 12px;
            background: rgba(71, 85, 105, 0.2);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 10px;
        }

        input[type="file"] { display: none; }

        .export-container {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 30px;
        }

        .export-section {
            margin-bottom: 20px;
        }

        .export-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        .export-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .prompt-preview {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Prompt Generator</h1>

        <div class="button-group">
            <button class="btn-preset" onclick="togglePresets()">📋 Предустановки</button>
            <button class="btn-history" onclick="toggleHistory()">📚 История (<span id="historyCount">0</span>)</button>
            <button class="btn-import" onclick="document.getElementById('fileInput').click()">📂 Импорт</button>
            <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)">
        </div>

        <div id="presetsPanel" class="panel hidden">
            <h3>Выбери предустановку:</h3>
            <button class="btn-export" onclick="applyPreset('ecommerce)" style="width: 100%; margin-bottom: 10px;">🛒 E-commerce магазин</button>
            <button class="btn-export" onclick="applyPreset('saas')" style="width: 100%; margin-bottom: 10px;">☁️ SaaS приложение</button>
            <button class="btn-export" onclick="applyPreset('portfolio')" style="width: 100%; margin-bottom: 10px;">🎨 Портфолио разработчика</button>
            <button class="btn-export" onclick="applyPreset('api')" style="width: 100%;">⚙️ REST API сервис</button>
        </div>

        <div id="historyPanel" class="panel hidden">
            <h3>История проектов:</h3>
            <div id="historyList"></div>
        </div>

        <div class="progress-container">
            <div class="progress-text">
                <span>Шаг <span id="currentStep">1</span> из <span id="totalSteps">10</span></span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="question-container" id="questionContainer">
            <div id="blockLabel" class="question-block"></div>
            <h2 id="questionText"></h2>
            <textarea id="answerInput" placeholder="Введи ответ..."></textarea>
            <div class="button-nav">
                <button class="btn-nav" id="btnPrev" onclick="prevQuestion()" disabled>← Назад</button>
                <button class="btn-next btn-nav" id="btnNext" onclick="nextQuestion()" disabled>Далее →</button>
            </div>
        </div>

        <div id="finalPanel" class="export-container hidden">
            <div class="export-section">
                <h3>Сохрани проект:</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="projectName" placeholder="Например: E-commerce v1...">
                    <button class="btn-preset" onclick="saveToHistory()" style="padding: 12px 20px; white-space: nowrap;">💾 Сохр.</button>
                </div>
            </div>

            <div class="export-section">
                <h3>Превью промта:</h3>
                <div class="prompt-preview" id="promptPreview"></div>
            </div>

            <div class="export-section">
                <h3>Экспорт:</h3>
                <div class="export-buttons" style="grid-template-columns: 1fr 1fr 1fr;">
                    <button class="btn-export" onclick="copyPrompt()">📋 Копировать</button>
                    <button class="btn-export" onclick="downloadFile(getPrompt(), 'prompt.md', 'text/markdown')">📥 .md</button>
                    <button class="btn-export" onclick="downloadFile(getJSON(), 'answers.json', 'application/json')">📥 .json</button>
                </div>
                <button class="btn-export" onclick="polishPrompt()" style="width: 100%; margin-top: 10px;">✨ Полировка AI</button>
                <div id="apiSection" style="margin-top: 10px;">
                    <input type="password" id="apiKey" placeholder="sk-ant-..." style="margin-bottom: 5px;">
                    <p style="font-size: 12px; color: #64748b;">🔒 Ключ только в браузере</p>
                    <div id="polishMsg"></div>
                </div>
                <button class="btn-export" onclick="resetAll()" style="width: 100%; margin-top: 10px;">🔄 Заново</button>
            </div>
        </div>
    </div>

    <script>
        const presets = {
            ecommerce: { answers: { task: 'Интернет-магазин с каталогом товаров', problem: 'Позволяет продавать онлайн', audience: 'Клиенты и администраторы', scope: 'Каталог, корзина, оформление', payment: 'Stripe, карты, PayPal', security: 'OAuth, 2FA, GDPR', design: 'Минимализм, светлая тема', tech: 'React, Node.js, PostgreSQL', constraints: '4 недели, мобильная версия' } },
            saas: { answers: { task: 'Платформа управления проектами', problem: 'Экономит время команде', audience: 'PM, разработчики', scope: 'Доски, комментарии, уведомления', payment: 'Stripe, $29/месяц', security: '2FA, SSO, GDPR', design: 'Современный минимализм', tech: 'React, NestJS, WebSocket', constraints: '3 месяца' } },
            portfolio: { answers: { task: 'Личное портфолио разработчика', problem: 'Показывает навыки работодателям', audience: 'Рекрутеры, работодатели', scope: 'Галерея, блог, контакты', design: 'Минимализм, тёмная тема', tech: 'Next.js, TypeScript, Vercel', constraints: '1 неделя, Lighthouse 95+' } },
            api: { answers: { task: 'REST API для управления пользователями', problem: 'Надёжный API для приложений', audience: 'Frontend, мобильные клиенты', scope: 'CRUD, авторизация, логирование', security: 'JWT, Rate limiting, CORS', tech: 'Node.js, NestJS, PostgreSQL', constraints: '3 недели, production-ready' } }
        };

        const questions = [
            { id: 'task', block: 'Суть проекта', question: 'Опиши идею проекта:', placeholder: 'Например: интерактивное портфолио...' },
            { id: 'problem', block: '→ Уточнение', question: 'Какую проблему это решает?', placeholder: 'Например: экономит время...', followup: true },
            { id: 'audience', block: 'Аудитория', question: 'Для кого это?', placeholder: 'Например: junior-разработчики...' },
            { id: 'scope', block: 'Функциональность', question: 'Какие ключевые функции?', placeholder: 'Например: галерея, фильтр...' },
            { id: 'payment', block: '→ Уточнение', question: 'Система оплаты?', placeholder: 'Например: Stripe, $9.99/месяц...', followup: true },
            { id: 'security', block: '→ Уточнение', question: 'Требования безопасности?', placeholder: 'Например: OAuth, 2FA...', followup: true },
            { id: 'design', block: 'Дизайн', question: 'Как это должно выглядеть?', placeholder: 'Например: минимализм, тёмная...' },
            { id: 'tech', block: 'Технологии', question: 'Какие технологии?', placeholder: 'Например: React, Node.js...' },
            { id: 'constraints', block: 'Ограничения', question: 'Есть ли ограничения?', placeholder: 'Например: 2 недели, мобильная...' }
        ];

        let currentStep = 0;
        let answers = {};
        let history = [];

        function init() {
            loadHistory();
            updateUI();
        }

        function updateUI() {
            const q = questions[currentStep];
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('blockLabel').textContent = q.block;
            document.getElementById('blockLabel').className = 'question-block' + (q.followup ? ' followup' : '');
            document.getElementById('answerInput').placeholder = q.placeholder;
            document.getElementById('answerInput').value = answers[q.id] || '';
            document.getElementById('currentStep').textContent = currentStep + 1;
            document.getElementById('totalSteps').textContent = questions.length;
            
            const progress = ((currentStep + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressPercent').textContent = Math.round(progress) + '%';

            document.getElementById('btnPrev').disabled = currentStep === 0;
            document.getElementById('btnNext').disabled = !answers[q.id] || currentStep === questions.length - 1;

            if (currentStep === questions.length - 1 && Object.keys(answers).length > 0) {
                document.getElementById('questionContainer').classList.add('hidden');
                document.getElementById('finalPanel').classList.remove('hidden');
                document.getElementById('promptPreview').textContent = getPrompt();
            } else {
                document.getElementById('questionContainer').classList.remove('hidden');
                document.getElementById('finalPanel').classList.add('hidden');
            }
        }

        function nextQuestion() {
            answers[questions[currentStep].id] = document.getElementById('answerInput').value;
            currentStep++;
            updateUI();
        }

        function prevQuestion() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        }

        function getPrompt() {
            let result = '# Техническое задание\n\n';
            const sections = [
                ['task', 'Суть проекта'],
                ['problem', 'Решаемая проблема'],
                ['audience', 'Целевая аудитория'],
                ['scope', 'Функциональность'],
                ['payment', 'Система оплаты'],
                ['security', 'Безопасность'],
                ['design', 'Дизайн'],
                ['tech', 'Технологии'],
                ['constraints', 'Ограничения']
            ];
            sections.forEach(([key, title]) => {
                if (answers[key]) result += `## ${title}\n${answers[key]}\n\n`;
            });
            return result;
        }

        function getJSON() {
            return JSON.stringify({ project: { generatedAt: new Date().toISOString(), answers } }, null, 2);
        }

        function copyPrompt() {
            navigator.clipboard.writeText(getPrompt()).then(() => alert('✓ Скопировано!'));
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function saveToHistory() {
            const name = document.getElementById('projectName').value;
            if (!name) { alert('Введи название'); return; }
            const item = { id: Date.now(), name, date: new Date().toLocaleString('ru-RU'), answers: {...answers} };
            history.unshift(item);
            localStorage.setItem('promptHistory', JSON.stringify(history));
            alert('✓ Сохранён!');
            document.getElementById('projectName').value = '';
            updateHistoryCount();
        }

        function loadHistory() {
            const saved = localStorage.getItem('promptHistory');
            if (saved) history = JSON.parse(saved);
            updateHistoryCount();
        }

        function updateHistoryCount() {
            document.getElementById('historyCount').textContent = history.length;
        }

        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                let html = history.length === 0 ? '<p style="color: #64748b;">Нет проектов</p>' : '';
                history.forEach(item => {
                    html += `<div class="panel-item"><div><div style="font-weight: 600;">${item.name}</div><div style="font-size: 12px; color: #64748b;">${item.date}</div></div><div><button class="btn-export" onclick="loadItem(${item.id})">✓</button><button class="btn-export" onclick="deleteItem(${item.id})">✕</button></div></div>`;
                });
                document.getElementById('historyList').innerHTML = html;
            }
        }

        function loadItem(id) {
            const item = history.find(h => h.id === id);
            if (item) {
                answers = {...item.answers};
                currentStep = 0;
                document.getElementById('presetsPanel').classList.add('hidden');
                document.getElementById('historyPanel').classList.add('hidden');
                updateUI();
            }
        }

        function deleteItem(id) {
            history = history.filter(h => h.id !== id);
            localStorage.setItem('promptHistory', JSON.stringify(history));
            updateHistoryCount();
            toggleHistory();
            toggleHistory();
        }

        function togglePresets() {
            document.getElementById('presetsPanel').classList.toggle('hidden');
        }

        function applyPreset(key) {
            answers = {...presets[key].answers};
            currentStep = 0;
            document.getElementById('presetsPanel').classList.add('hidden');
            updateUI();
            alert(`✓ Применена!`);
        }

        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.project?.answers) {
                        answers = data.project.answers;
                        currentStep = 0;
                        updateUI();
                        alert('✓ Загружено!');
                    }
                } catch {
                    alert('❌ Ошибка');
                }
            };
            reader.readAsText(file);
        }

        async function polishPrompt() {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) { alert('Введи API ключ'); return; }

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
                    body: JSON.stringify({
                        model: 'claude-opus-4-20250805',
                        max_tokens: 2000,
                        messages: [{ role: 'user', content: `Улучши ТЗ:\n\n${getPrompt()}` }]
                    })
                });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('promptPreview').textContent = data.content[0].text;
                    document.getElementById('polishMsg').innerHTML = '<div class="msg">✓ Полировка завершена!</div>';
                }
            } catch (e) {
                alert('Ошибка API');
            }
        }

        function resetAll() {
            answers = {};
            currentStep = 0;
            document.getElementById('projectName').value = '';
            updateUI();
        }

        init();
    </script>
</body>
</html>
